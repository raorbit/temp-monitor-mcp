name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TempMon.slnx

      - name: Build
        run: dotnet build TempMon.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TempMon.slnx -c Release --no-build
